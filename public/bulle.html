<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Ma bulle</title>
<script src="https://play.workadventu.re/iframe_api.js"></script>
<style>
  html, body { margin: 0; padding: 0; background: transparent; overflow: hidden; font-family: Inter, system-ui, sans-serif; font-size: 14px; color: #1d1d23; }
  * { box-sizing: border-box; }
  button { font: inherit; cursor: pointer; }
  /* Repliée : une bulle ronde, pour ne pas ressembler à un bouton classique */
  #bar { display: none; width: 100vw; height: 100vh; align-items: center; justify-content: center; }
  #pill { position: relative; width: 100%; height: 100%; border-radius: 50%; border: 3px solid #fff; background: #6e1fff; color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; line-height: 1; box-shadow: 0 3px 14px rgba(0,0,0,.35); }
  #pill:hover { background: #4a04be; }
  #pill b { font-size: 22px; font-weight: 800; }
  #pill small { font-size: 10px; letter-spacing: .4px; text-transform: uppercase; margin-top: 3px; }
  #hide { position: absolute; top: -4px; right: -4px; width: 22px; height: 22px; border-radius: 50%; border: 2px solid #fff; background: #1d1d23; color: #fff; font-size: 13px; line-height: 1; padding: 0; }
  #hide:hover { background: #b3261e; }
  /* Dépliée : une grande bulle aux coins arrondis, sans barre de défilement tant qu'elle tient */
  #card { display: none; height: 100vh; flex-direction: column; background: #fff; border: 2px solid #6e1fff; border-radius: 26px; box-shadow: 0 6px 24px rgba(0,0,0,.32); overflow: hidden; }
  .head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 12px 14px 10px 18px; }
  .head strong { font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  .tools { display: flex; gap: 6px; flex: none; }
  .x { width: 32px; height: 32px; border-radius: 50%; border: 1px solid rgba(20,16,35,.18); background: #fff; font-size: 18px; line-height: 1; padding: 0; }
  .x:hover { background: #6e1fff; border-color: #6e1fff; color: #fff; }
  .list { flex: 1; min-height: 0; overflow-y: auto; padding: 0 14px; scrollbar-width: thin; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 10px; min-height: 54px; border-top: 1px solid rgba(20,16,35,.08); }
  .name { min-width: 0; flex: 1; font-size: 15px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Micro : l'émoji suffit ; un clic coupe le micro et le barre */
  .mic { position: relative; flex: none; width: 42px; height: 42px; border-radius: 50%; border: 1px solid rgba(20,16,35,.2); background: #fff; font-size: 21px; line-height: 1; padding: 0; }
  .mic:hover { border-color: #6e1fff; background: #f3edff; }
  .mic.off { background: #fdecea; border-color: #b3261e; }
  .mic.off::after { content: ""; position: absolute; left: 7px; right: 7px; top: 50%; height: 3px; background: #b3261e; border-radius: 2px; box-shadow: 0 0 0 2px #fff; transform: rotate(-45deg); }
  .btn { flex: none; min-height: 34px; padding: 0 14px; border-radius: 999px; border: 1px solid rgba(20,16,35,.22); background: #fff; font-size: 13px; font-weight: 500; white-space: nowrap; }
  .btn:hover:not(:disabled) { border-color: #6e1fff; color: #6e1fff; }
  .btn.cut { background: #6e1fff; border-color: #6e1fff; color: #fff; }
  .btn.cut:hover:not(:disabled) { background: #4a04be; border-color: #4a04be; color: #fff; }
  .btn.all { border-color: #b3261e; color: #b3261e; }
  .btn.all:hover:not(:disabled) { background: #fdecea; border-color: #b3261e; color: #b3261e; }
  .btn.danger { background: #b3261e; border-color: #b3261e; color: #fff; }
  .btn:disabled { opacity: .55; cursor: default; }
  .foot { padding: 10px 14px 14px; display: grid; gap: 8px; border-top: 1px solid rgba(20,16,35,.08); }
  .foot .confirm { display: flex; gap: 8px; }
  .note { font-size: 12px; color: #55525e; margin: 0; }
  .ok { color: #2e9e1b; } .err { color: #b3261e; }
  button:focus-visible { outline: 3px solid #6e1fff; outline-offset: 2px; }
</style>
</head>
<body>
<div id="bar"><button id="pill" type="button" aria-label="Déplier la liste de ma bulle"><b id="count">0</b><small>bulle</small></button><button id="hide" type="button" aria-label="Masquer complètement" title="Masquer complètement (rouvrir par le menu du jeu)">&times;</button></div>
<div id="card">
  <div class="head"><strong id="title"></strong><div class="tools"><button class="x" id="fold" type="button" aria-label="Réduire en bulle" title="Réduire en bulle ronde">&times;</button></div></div>
  <div class="list" id="list"></div>
  <div class="foot" id="foot">
    <button class="btn all" id="all" type="button">🎤 Couper tout le monde…</button>
    <div class="confirm" id="confirm" style="display:none"><button class="btn danger" id="yes" type="button"></button><button class="btn" id="no" type="button">Annuler</button></div>
    <p class="note" id="msg">Le staff et les admins ne sont pas concernés.</p>
  </div>
</div>
<script>
(function () {
  var COLLAPSED = { width: "72px", height: "72px" };
  var WIDE = "460px";
  var me = null;
  var collapsed = false;
  var busy = false;
  var confirming = false;
  var cut = {};

  function people() {
    try {
      var raw = new URLSearchParams(location.hash.replace(/^#/, "")).get("p");
      var list = JSON.parse(raw || "[]");
      return Array.isArray(list) ? list.filter(function (p) { return p && p.uuid && p.name; }).slice(0, 40) : [];
    } catch (e) { return []; }
  }

  function applySize(n) {
    if (typeof WA === "undefined") return;
    WA.ui.website.getById(WA.iframeId).then(function (w) {
      if (!w) return;
      w.size = collapsed ? COLLAPSED : { width: WIDE, height: Math.min(112 + 54 * Math.max(n, 1) + (n > 1 ? 46 : 0), 540) + "px" };
    }).catch(function () {});
  }

  function send(targets) {
    if (!me || busy || targets.length === 0) return;
    busy = true;
    var cmd = {
      v: 1,
      id: Date.now().toString(36) + "-" + Math.random().toString(36).slice(2, 8),
      action: "mute", reason: "other",
      targets: targets.map(function (t) { return { uuid: t.uuid, sessionId: "" }; }),
      by: me.name, byUuid: me.uuid, at: Date.now()
    };
    var variable = me.admin ? "adminCommand" : "staffCommand";
    Promise.resolve(WA.state.saveVariable(variable, JSON.stringify(cmd))).then(function () {
      say(targets.length === 1 ? "Micro de " + targets[0].name + " coupé." : targets.length + " micros coupés.", true);
    }).catch(function () {
      say("La coupure n'a pas pu partir. Réessaie.", false);
    }).then(function () { busy = false; });
  }

  function say(text, ok) {
    var m = document.getElementById("msg");
    m.textContent = text;
    m.className = "note " + (ok ? "ok" : "err");
  }

  function render() {
    var list = people();
    var n = list.length;
    document.getElementById("count").textContent = String(n);
    document.getElementById("bar").style.display = collapsed ? "flex" : "none";
    document.getElementById("card").style.display = collapsed ? "none" : "flex";
    document.getElementById("title").textContent = "Ma bulle · " + n + (n > 1 ? " personnes" : " personne");
    var box = document.getElementById("list");
    box.textContent = "";
    list.forEach(function (p) {
      var row = document.createElement("div"); row.className = "row";
      var name = document.createElement("span"); name.className = "name"; name.textContent = p.name;
      var b = document.createElement("button"); b.type = "button";
      b.className = "mic" + (cut[p.uuid] ? " off" : ""); b.textContent = "\uD83C\uDFA4";
      b.title = "Couper le micro de " + p.name; b.setAttribute("aria-label", "Couper le micro de " + p.name);
      b.addEventListener("click", function () { cut[p.uuid] = true; b.classList.add("off"); send([p]); });
      row.appendChild(name); row.appendChild(b); box.appendChild(row);
    });
    // « Tout le monde » : seulement à partir de 2 personnes, discret, avec confirmation
    var showAll = n > 1;
    document.getElementById("foot").style.display = "grid";
    document.getElementById("all").style.display = showAll && !confirming ? "inline-block" : "none";
    document.getElementById("confirm").style.display = showAll && confirming ? "flex" : "none";
    document.getElementById("yes").textContent = "Oui, couper " + n + " micros";
    if (!showAll) confirming = false;
    applySize(n);
  }

  document.getElementById("all").addEventListener("click", function () { confirming = true; render(); });
  document.getElementById("no").addEventListener("click", function () { confirming = false; render(); });
  document.getElementById("yes").addEventListener("click", function () { confirming = false; people().forEach(function (p) { cut[p.uuid] = true; }); send(people()); render(); });
  document.getElementById("pill").addEventListener("click", function () { collapsed = false; render(); });
  document.getElementById("fold").addEventListener("click", function () { collapsed = true; render(); });
  // Masquer : le script ferme le cadre ; il se rouvre à l'entrée dans une bulle ou par le menu du jeu.
  function hide() {
    if (typeof WA === "undefined") return;
    WA.player.state.saveVariable("bulleMasquee", true, { public: false, persist: false }).catch(function () {});
  }
  document.getElementById("hide").addEventListener("click", hide);
  window.addEventListener("hashchange", render);

  render();
  if (typeof WA !== "undefined") {
    WA.onInit().then(function () {
      var tags = WA.player.tags || [];
      me = { uuid: WA.player.uuid || "", name: WA.player.name || "Modération", admin: tags.indexOf("admin") !== -1 };
      render();
    });
  }
})();
</script>
</body>
</html>
